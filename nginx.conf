server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Access control is handled at the CapRover layer (HTTP Settings → Enable Basic
  # Auth) — the container stays open on purpose, like the other apps.

  # Same-origin proxy to the WorkFlowy API (https://workflowy.com/api/v1).
  # WorkFlowy sends no CORS headers, so a browser cannot call it directly.
  # The browser sends the user's API key in `X-Workflowy-Key` (NOT `Authorization`,
  # which CapRover's Basic Auth uses on every same-origin request); this block turns
  # it into `Authorization: Bearer …` and drops cookies and the Basic Auth header so
  # WorkFlowy never sees the CapRover credentials. The key is never stored on the
  # server: it lives only in the user's browser.
  # Only the endpoints the app uses are reachable: targets, nodes-export, and nodes
  # (list / get / create / update / delete / complete / uncomplete / move / mirror).
  # This file is an envsubst TEMPLATE: the image entrypoint renders it at start and
  # fills in the local DNS resolver.
  location ~ ^/api/workflowy/(?<wf_path>targets|nodes-export|nodes(/[A-Za-z0-9_-]+(/(complete|uncomplete|move|mirror))?)?)$ {
    limit_except GET POST DELETE { deny all; }
    client_max_body_size 256k;
    default_type application/json;

    if ($http_x_workflowy_key = "") {
      return 401 '{"error":"X-Workflowy-Key header is required"}';
    }

    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $wf_upstream https://workflowy.com;
    proxy_pass $wf_upstream/api/v1/$wf_path$is_args$args;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host workflowy.com;
    proxy_set_header Authorization "Bearer $http_x_workflowy_key";
    proxy_set_header X-Workflowy-Key "";
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store";
  }

  # Anything else under /api/ is not ours. Deliberately NOT `^~`: a `^~` prefix would win over
  # the regex location above and the proxy would never match.
  location /api/ {
    default_type application/json;
    return 404 '{"error":"not found"}';
  }

  # Vite emits content-hashed filenames under /assets — safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA history fallback — every unknown path renders the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the shell itself, so a new deploy is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Commit SHA of the running image — the deploy workflow polls it to confirm a rollout.
  location = /version.txt {
    default_type text/plain;
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
}
